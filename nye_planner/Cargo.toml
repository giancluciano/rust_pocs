[package]
name = "nye_planner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli"] }
schemars = "1"
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarms-rs = "0.3.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# Standalone: keeps this crate out of any Cargo workspace in a parent directory.
[workspace]
