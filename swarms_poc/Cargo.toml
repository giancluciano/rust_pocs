[package]
name = "swarms_poc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenv = "0.15.0"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarms-rs = "0.2.1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
